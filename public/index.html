<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heo Media — Content systems</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/client.css">
</head>
<body>
  <div id="cursor"></div>
  
  <div id="app">
    <!-- Navbar with Mobile Toggle -->
    <nav class="nav">
      <div class="logo" onclick="landing()" style="cursor:pointer">Heo <i>Media</i></div>
      
      <button class="menu-toggle" aria-label="Toggle Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="navlinks">
        <a href="#services" onclick="landing(); goMarketing('services'); return false;">01 Services</a>
        <a href="#work" onclick="landing(); goMarketing('work'); return false;">02 Work</a>
        <a href="#about" onclick="landing(); goMarketing('about'); return false;">03 About</a>
        <a href="https://www.instagram.com/hubbanshaikhh?utm_source=ig_web_button_share_sheet&stkn=ZDNlZDc0MzIxNw==" target="_blank" rel="noopener">04 Instagram</a>
      </div>
    </nav>
  </div>

  <script src="/app.js"></script>
  
  <!-- Robust Mobile Navigation Handler (Fixed Click propagation) -->
  <script>
    const observer = new MutationObserver(() => {
      const nav = document.querySelector('.nav');
      const navlinks = document.querySelector('.navlinks');
      const toggleBtn = document.querySelector('.menu-toggle');
      
      if (nav && navlinks && toggleBtn) {
        // Bind toggle only once to prevent duplicate listeners
        if (!toggleBtn.dataset.bound) {
          toggleBtn.dataset.bound = 'true';
          
          toggleBtn.onclick = () => {
            toggleBtn.classList.toggle('active');
            navlinks.classList.toggle('active');
          };

          // Use addEventListener so we don't overwrite inline onclick functions
          navlinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
              toggleBtn.classList.remove('active');
              navlinks.classList.remove('active');
            });
          });
        }
      }
    });

    observer.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>

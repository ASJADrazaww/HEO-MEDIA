<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heo Media — Content systems</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/client.css">
</head>
<body>
  <div id="cursor"></div>
  
  <!-- Empty app container for dynamic JavaScript rendering -->
  <div id="app"></div>

  <script src="/app.js"></script>
  
  <script>
    // Trigger initial landing render safely
    window.addEventListener('DOMContentLoaded', () => {
      if (typeof landing === 'function') {
        landing();
      }
      initScrollAnimations();
    });

    // Custom Cursor Movement & Hover Effects
    const cursor = document.getElementById('cursor');
    
    window.addEventListener('mousemove', e => {
      if (cursor) {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
      }
    });

    document.addEventListener('mouseover', e => {
      if (e.target.matches('a, button, .button, .navitem, input, select')) {
        cursor.classList.add('grow');
      }
    });

    document.addEventListener('mouseout', e => {
      if (e.target.matches('a, button, .button, .navitem, input, select')) {
        cursor.classList.remove('grow');
      }
    });

    // Scroll Reveal Animation Observer
    function initScrollAnimations() {
      const observerOptions = {
        threshold: 0.1
      };

      const scrollObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('reveal-active');
            // Optional: observer.unobserve(entry.target); agar ek hi baar animation chalana ho
          }
        });
      }, observerOptions);

      // Elements ko observe karo (panels, cards, hero section etc.)
      document.querySelectorAll('.panel, .hero, .landing-pages, .visit-highlight, .float-card').forEach(el => {
        el.classList.add('reveal-item');
        scrollObserver.observe(el);
      });
    }

    // Mobile menu toggle handler binding dynamically
    const observer = new MutationObserver(() => {
      const navlinks = document.querySelector('.navlinks');
      const toggleBtn = document.querySelector('.menu-toggle');
      
      if (navlinks && toggleBtn && !toggleBtn.dataset.bound) {
        toggleBtn.dataset.bound = 'true';
        
        toggleBtn.onclick = () => {
          toggleBtn.classList.toggle('active');
          navlinks.classList.toggle('active');
        };

        navlinks.querySelectorAll('a').forEach(link => {
          link.addEventListener('click', () => {
            toggleBtn.classList.remove('active');
            navlinks.classList.remove('active');
          });
        });
      }
      // Naye content render hone par bhi scroll animation re-init kar sakte hain
      initScrollAnimations();
    });

    observer.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
